<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" role="img" aria-labelledby="title desc"><title id="title">SOC Home Lab documented architecture</title><desc id="desc">Windows on VMware connects through dedicated Ethernet and switch VLAN 122 to Wazuh on Proxmox. Shuffle has a historical Linux-event integration. Caldera and Windows Server network attachment remain unverified.</desc><rect width="1120" height="840" fill="#0b1424"/><style>text{font-family:Arial,sans-serif;fill:#edf3ff}.title{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#afc2da}.label{font-size:18px;font-weight:bold}.body{font-size:15px}.edge{stroke:#59d5ba;stroke-width:3;fill:none}.planned{stroke:#b5a1ef;stroke-width:2;stroke-dasharray:7 6;fill:none}</style><text x="40" y="48" class="title">SOC HOME LAB</text><text x="40" y="76" class="sub">Documented working baseline: 16 Nov 2026 • Documented: 17 Nov 2026</text><rect x="40" y="110" width="470" height="150" rx="13" fill="#14253c" stroke="#3d628b" stroke-width="2"/><text x="60" y="141" class="label">iMac • VMware Fusion</text><text x="60" y="169" class="body">Windows 11 • Sysmon • Wazuh agent</text><text x="60" y="192" class="body">Dedicated USB Ethernet → switch port 2</text><text x="60" y="215" class="body">Bridged lab connection; no default gateway in test</text><rect x="610" y="110" width="470" height="150" rx="13" fill="#14253c" stroke="#3d628b" stroke-width="2"/><text x="630" y="141" class="label">Mini PC • Proxmox VE</text><text x="630" y="169" class="body">Wazuh SIEM VM 110 • Shuffle SOAR VM 120</text><text x="630" y="192" class="body">Separate lab USB Ethernet → switch port 3</text><text x="630" y="215" class="body">vmbr1 lab bridge; vmbr0 management separate</text><rect x="280" y="330" width="560" height="120" rx="13" fill="#14253c" stroke="#59d5ba" stroke-width="2"/><text x="300" y="361" class="label">TP-Link switch • shared VLAN 122</text><text x="300" y="389" class="body">Ports 2 and 3: untagged / PVID 122</text><text x="300" y="412" class="body">Working Windows-to-Wazuh path; routed VLAN separation unproven</text><path d="M275 260 V300 H390 V330" class="edge"/><path d="M845 260 V300 H730 V330" class="edge"/><rect x="40" y="500" width="470" height="110" rx="13" fill="#14253c" stroke="#3d628b" stroke-width="2"/><text x="60" y="531" class="label">Windows telemetry → Wazuh</text><text x="60" y="559" class="body">TCP 1514 • active agent • raw event collection</text><text x="60" y="582" class="body">Lab 01: custom encoded PowerShell detection</text><rect x="610" y="500" width="470" height="110" rx="13" fill="#14253c" stroke="#3d628b" stroke-width="2"/><text x="630" y="531" class="label">Wazuh → Shuffle • historical test</text><text x="630" y="559" class="body">Linux event → rule 100102 → finished execution</text><text x="630" y="582" class="body">Windows-to-Shuffle remains a future validation</text><rect x="40" y="660" width="470" height="110" rx="13" fill="#14253c" stroke="#b5a1ef" stroke-width="2"/><text x="60" y="691" class="label">Other VMware VMs</text><text x="60" y="719" class="body">Caldera 5.3.0 UI • 0 agents / 0 operations</text><text x="60" y="742" class="body">Windows Server 2025 • AD role unverified</text><rect x="610" y="660" width="470" height="110" rx="13" fill="#14253c" stroke="#b5a1ef" stroke-width="2"/><text x="630" y="691" class="label">Future network design</text><text x="630" y="719" class="body">Endpoint VLAN 121 ↔ monitoring VLAN 122</text><text x="630" y="742" class="body">ER605 policy and end-to-end routing unresolved</text><text x="40" y="811" class="sub">No live addresses or device MACs published. Personal networks and NAS remain outside test scope.</text></svg>
